services:

  nginx:
    image: nginx:1.27-alpine
    container_name: autoshield-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx

    depends_on:
      juice-shop:
        condition: service_started

    networks:
      - autoshield_net


  juice-shop:
    image: bkimminich/juice-shop:v19.0.0
    container_name: autoshield-juice-shop

    networks:
      - autoshield_net


networks:

  autoshield_net:
    name: autoshield_net
    driver: bridge


volumes:

  nginx_logs: